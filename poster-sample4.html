<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraim ポスター サンプル4 - レイヤードカード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c2c2c;
            padding: 20px;
            font-family: 'Arial', sans-serif;
        }
        
        .poster {
            width: 420px;
            height: 594px;
            background: linear-gradient(180deg, #FFF8F3 0%, #FFE8D6 50%, #FFCC99 100%);
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        /* 複雑な背景パターン */
        .bg-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                repeating-linear-gradient(45deg, #FF8C42 0, #FF8C42 1px, transparent 1px, transparent 15px),
                repeating-linear-gradient(-45deg, #FF8C42 0, #FF8C42 1px, transparent 1px, transparent 15px);
        }
        
        /* 装飾的な円形要素 */
        .floating-circles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 140, 66, 0.3), transparent);
        }
        
        .circle1 {
            width: 150px;
            height: 150px;
            top: -50px;
            right: -50px;
        }
        
        .circle2 {
            width: 100px;
            height: 100px;
            bottom: 100px;
            left: -30px;
        }
        
        .circle3 {
            width: 80px;
            height: 80px;
            top: 300px;
            right: 20px;
            background: radial-gradient(circle, rgba(255, 166, 93, 0.4), transparent);
        }
        
        /* コンポーネント1 - 3Dカード風 */
        .component-1 {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 180px;
            height: 100px;
            transform: perspective(600px) rotateY(-5deg);
            transform-style: preserve-3d;
        }
        
        .component-1::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            border-radius: 15px;
            box-shadow: 
                0 20px 40px rgba(255, 107, 53, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transform: translateZ(20px);
        }
        
        .component-1::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #CC5522;
            border-radius: 15px;
            transform: translateZ(-10px) translateX(5px) translateY(5px);
            opacity: 0.5;
        }
        
        /* コンポーネント2 - グラスモーフィズム */
        .component-2 {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 180px;
            height: 100px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px solid rgba(255, 140, 66, 0.3);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.1),
                inset 0 0 15px rgba(255, 140, 66, 0.1);
            overflow: hidden;
        }
        
        .component-2::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transform: rotate(45deg);
        }
        
        /* コンポーネント3 - 折り紙風 */
        .component-3 {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            height: 90px;
            background: #FFA65D;
            clip-path: polygon(0 0, 95% 0, 100% 50%, 95% 100%, 0 100%, 5% 50%);
            box-shadow: 
                0 10px 30px rgba(255, 166, 93, 0.3),
                inset -5px 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .component-3::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.3), transparent);
            clip-path: inherit;
        }
        
        /* コンポーネント4 - ネオン風ボーダー */
        .component-4 {
            position: absolute;
            top: 260px;
            left: 30px;
            width: 170px;
            height: 110px;
            background: white;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .component-4::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: linear-gradient(45deg, #FF6B35, #FFA65D, #FF6B35);
            border-radius: 15px;
            z-index: -1;
            animation: glow 3s linear infinite;
        }
        
        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .component-4::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: white;
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        /* コンポーネント5 - モーフィング */
        .component-5 {
            position: absolute;
            top: 260px;
            right: 30px;
            width: 170px;
            height: 110px;
            background: linear-gradient(145deg, #FFE8D6, #FFCC99);
            border-radius: 30% 70% 70% 30% / 60% 40% 60% 40%;
            box-shadow: 
                15px 15px 30px rgba(204, 133, 77, 0.3),
                -15px -15px 30px rgba(255, 255, 255, 0.7),
                inset 3px 3px 5px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .component-5::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            background: rgba(255, 140, 66, 0.1);
            border-radius: inherit;
            filter: blur(10px);
        }
        
        /* コンポーネント6 - 積層カード */
        .component-6 {
            position: absolute;
            bottom: 130px;
            left: 30px;
            width: 150px;
            height: 80px;
            position: relative;
        }
        
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .layer1 {
            background: #FF6B35;
            transform: rotate(-3deg) translateY(5px);
            z-index: 1;
        }
        
        .layer2 {
            background: #FF8C42;
            transform: rotate(0deg);
            z-index: 2;
        }
        
        .layer3 {
            background: linear-gradient(135deg, #FFA65D, #FFCC99);
            transform: rotate(3deg) translateY(-5px);
            z-index: 3;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        
        /* コンポーネント7 - 複雑なグラデーション */
        .component-7 {
            position: absolute;
            bottom: 130px;
            right: 30px;
            width: 210px;
            height: 80px;
            background: 
                linear-gradient(90deg, #FF6B35 0%, transparent 40%, transparent 60%, #FFA65D 100%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, transparent 50%, rgba(0, 0, 0, 0.1) 100%),
                linear-gradient(135deg, #FF8C42, #FFCC99);
            border-radius: 40px;
            box-shadow: 
                0 15px 40px rgba(255, 140, 66, 0.3),
                inset 0 -3px 6px rgba(0, 0, 0, 0.1),
                inset 0 3px 6px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .component-7::before {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            filter: blur(20px);
        }
        
        .component-7::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* 底部装飾 */
        .bottom-decoration {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            background: 
                repeating-linear-gradient(90deg, 
                    #FF8C42 0px, #FF8C42 2px, 
                    transparent 2px, transparent 10px),
                repeating-linear-gradient(0deg, 
                    #FFA65D 0px, #FFA65D 2px, 
                    transparent 2px, transparent 10px);
            opacity: 0.1;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="bg-pattern"></div>
        <div class="floating-circles">
            <div class="circle circle1"></div>
            <div class="circle circle2"></div>
            <div class="circle circle3"></div>
        </div>
        
        <div class="component-1"></div>
        <div class="component-2"></div>
        <div class="component-3"></div>
        <div class="component-4"></div>
        <div class="component-5"></div>
        <div class="component-6">
            <div class="layer layer1"></div>
            <div class="layer layer2"></div>
            <div class="layer layer3"></div>
        </div>
        <div class="component-7"></div>
        <div class="bottom-decoration"></div>
    </div>
</body>
</html>
