<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraim ポスター サンプル2 - ネオモーフィズム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e0e0e0;
            padding: 20px;
        }
        
        .poster {
            width: 420px;
            height: 594px;
            background: linear-gradient(145deg, #FFE8D6, #FFCC99);
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        
        /* 大きな円形グラデーション */
        .big-circle {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #FF6B35, transparent);
            opacity: 0.2;
            border-radius: 50%;
        }
        
        /* タイトルエリア - ネオモーフィズム */
        .component-1 {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 90px;
            background: linear-gradient(145deg, #FFE8D6, #FFCC99);
            border-radius: 25px;
            box-shadow: 
                20px 20px 40px rgba(204, 133, 77, 0.3),
                -20px -20px 40px rgba(255, 255, 255, 0.7),
                inset 1px 1px 2px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #FF6B35;
        }
        
        /* アプリ概要 - フローティング */
        .component-2 {
            position: absolute;
            top: 160px;
            left: 35px;
            width: 350px;
            height: 90px;
            background: linear-gradient(145deg, #FFFFFF, #FFF5EB);
            border-radius: 20px;
            box-shadow: 
                10px 10px 20px rgba(204, 133, 77, 0.2),
                -10px -10px 20px rgba(255, 255, 255, 0.7);
        }
        
        /* 機能カード群 */
        .component-3 {
            position: absolute;
            top: 270px;
            left: 35px;
            width: 160px;
            height: 110px;
            background: #FF8C42;
            border-radius: 20px;
            box-shadow: 
                8px 8px 16px rgba(204, 133, 77, 0.3),
                -8px -8px 16px rgba(255, 255, 255, 0.5);
            opacity: 0.9;
        }
        
        .component-4 {
            position: absolute;
            top: 270px;
            right: 35px;
            width: 160px;
            height: 110px;
            background: #FFA65D;
            border-radius: 20px;
            box-shadow: 
                8px 8px 16px rgba(204, 133, 77, 0.3),
                -8px -8px 16px rgba(255, 255, 255, 0.5);
            opacity: 0.9;
        }
        
        /* 技術詳細 */
        .component-5 {
            position: absolute;
            top: 400px;
            left: 35px;
            width: 350px;
            height: 70px;
            background: linear-gradient(145deg, #FFF5EB, #FFE8D6);
            border-radius: 15px;
            box-shadow: 
                inset 5px 5px 10px rgba(204, 133, 77, 0.2),
                inset -5px -5px 10px rgba(255, 255, 255, 0.7);
        }
        
        /* QRコード枠 */
        .component-6 {
            position: absolute;
            bottom: 70px;
            left: 35px;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 20px;
            box-shadow: 
                10px 10px 20px rgba(204, 133, 77, 0.2),
                -10px -10px 20px rgba(255, 255, 255, 0.7);
            border: 3px solid #FF8C42;
        }
        
        /* アクションボタン */
        .component-7 {
            position: absolute;
            bottom: 110px;
            right: 35px;
            width: 200px;
            height: 60px;
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            border-radius: 30px;
            box-shadow: 
                0 10px 25px rgba(255, 107, 53, 0.4),
                inset 0 -2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        /* 装飾的な小さな円 */
        .deco-dots {
            position: absolute;
            bottom: 30px;
            right: 50px;
        }
        
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #FFA65D;
            border-radius: 50%;
            margin: 0 5px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="big-circle"></div>
        <div class="component-1">Miraim</div>
        <div class="component-2"></div>
        <div class="component-3"></div>
        <div class="component-4"></div>
        <div class="component-5"></div>
        <div class="component-6"></div>
        <div class="component-7">詳細はこちら</div>
        <div class="deco-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
</body>
</html>
