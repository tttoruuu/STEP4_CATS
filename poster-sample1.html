<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraim ポスター サンプル1 - グラデーション波形</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            padding: 20px;
        }
        
        .poster {
            width: 420px;
            height: 594px;
            background: linear-gradient(135deg, #FFF5EB 0%, #FFE4CC 100%);
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        /* 波形の背景装飾 */
        .wave-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.3;
            background: 
                radial-gradient(circle at 20% 30%, #FF8C42 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #FFA65D 0%, transparent 40%);
        }
        
        /* タイトルエリア */
        .component-1 {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 80px;
            background: linear-gradient(90deg, #FF6B35, #FF8C42);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        
        /* アプリ概要 */
        .component-2 {
            position: absolute;
            top: 140px;
            left: 30px;
            width: 360px;
            height: 100px;
            background: white;
            border-radius: 15px;
            box-shadow: 
                inset 2px 2px 5px rgba(255, 140, 66, 0.1),
                5px 5px 15px rgba(255, 140, 66, 0.15);
            border-left: 5px solid #FF8C42;
        }
        
        /* 機能紹介1 */
        .component-3 {
            position: absolute;
            top: 260px;
            left: 30px;
            width: 170px;
            height: 120px;
            background: linear-gradient(135deg, #FFFFFF, #FFF5EB);
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(255, 140, 66, 0.2);
        }
        
        /* 機能紹介2 */
        .component-4 {
            position: absolute;
            top: 260px;
            right: 30px;
            width: 170px;
            height: 120px;
            background: linear-gradient(135deg, #FFF5EB, #FFFFFF);
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(255, 140, 66, 0.2);
        }
        
        /* 技術スタック */
        .component-5 {
            position: absolute;
            top: 400px;
            left: 30px;
            width: 360px;
            height: 80px;
            background: #FFE4CC;
            border-radius: 15px;
            box-shadow: inset 0 2px 5px rgba(255, 140, 66, 0.2);
        }
        
        /* デモ・QR */
        .component-6 {
            position: absolute;
            bottom: 80px;
            left: 30px;
            width: 150px;
            height: 50px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        /* 連絡先 */
        .component-7 {
            position: absolute;
            bottom: 80px;
            right: 30px;
            width: 150px;
            height: 50px;
            background: #FF8C42;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(255, 140, 66, 0.3);
        }
        
        /* 装飾的な円 */
        .decoration-circle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FFA65D, transparent);
            border-radius: 50%;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="wave-bg"></div>
        <div class="component-1">Miraim</div>
        <div class="component-2"></div>
        <div class="component-3"></div>
        <div class="component-4"></div>
        <div class="component-5"></div>
        <div class="component-6"></div>
        <div class="component-7"></div>
        <div class="decoration-circle"></div>
    </div>
</body>
</html>
