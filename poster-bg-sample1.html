<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraim ポスター背景 サンプル1 - 流体グラデーション</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
            padding: 20px;
        }
        
        .poster {
            width: 420px;
            height: 594px;
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            overflow: hidden;
            
            /* メインの背景グラデーション */
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 107, 53, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 140, 66, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 166, 93, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(255, 204, 153, 0.3) 0%, transparent 40%),
                linear-gradient(135deg, #FFF8F3 0%, #FFE8D6 25%, #FFCC99 75%, #FFB380 100%);
        }
        
        /* 流体的な形状レイヤー1 */
        .fluid-shape1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 50%;
            background: linear-gradient(45deg, rgba(255, 107, 53, 0.6), rgba(255, 140, 66, 0.3));
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            transform: rotate(-15deg);
            filter: blur(60px);
        }
        
        /* 流体的な形状レイヤー2 */
        .fluid-shape2 {
            position: absolute;
            bottom: -15%;
            right: -15%;
            width: 70%;
            height: 45%;
            background: radial-gradient(circle, rgba(255, 166, 93, 0.5), rgba(255, 204, 153, 0.2));
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            transform: rotate(25deg);
            filter: blur(50px);
        }
        
        /* 中央の光源効果 */
        .light-source {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            filter: blur(40px);
        }
        
        /* 細かいテクスチャパターン */
        .texture-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.08;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255, 140, 66, 0.1) 35px, rgba(255, 140, 66, 0.1) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255, 107, 53, 0.1) 35px, rgba(255, 107, 53, 0.1) 70px);
        }
        
        /* ソフトな波形パターン */
        .wave-pattern {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: 
                radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255, 140, 66, 0.2), transparent),
                radial-gradient(ellipse 500px 150px at 20% 90%, rgba(255, 166, 93, 0.15), transparent),
                radial-gradient(ellipse 500px 150px at 80% 90%, rgba(255, 204, 153, 0.15), transparent);
        }
        
        /* 上部のアクセント */
        .top-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: 
                linear-gradient(180deg, rgba(255, 107, 53, 0.15) 0%, transparent 100%),
                radial-gradient(ellipse 400px 200px at 50% 0%, rgba(255, 140, 66, 0.2), transparent);
        }
        
        /* 装飾的な円形要素 */
        .decorative-circles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent);
        }
        
        .circle1 {
            width: 120px;
            height: 120px;
            top: 15%;
            right: 10%;
            background: radial-gradient(circle, rgba(255, 140, 66, 0.2), transparent);
        }
        
        .circle2 {
            width: 80px;
            height: 80px;
            top: 40%;
            left: 15%;
            background: radial-gradient(circle, rgba(255, 166, 93, 0.25), transparent);
        }
        
        .circle3 {
            width: 150px;
            height: 150px;
            bottom: 20%;
            right: 25%;
            background: radial-gradient(circle, rgba(255, 204, 153, 0.15), transparent);
        }
        
        .circle4 {
            width: 60px;
            height: 60px;
            top: 60%;
            left: 10%;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.3), transparent);
        }
        
        /* ノイズテクスチャ効果 */
        .noise {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background: 
                repeating-conic-gradient(from 0deg at 50% 50%, 
                    #FF8C42 0deg, transparent 1deg, transparent 2deg, #FF8C42 3deg);
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="fluid-shape1"></div>
        <div class="fluid-shape2"></div>
        <div class="light-source"></div>
        <div class="wave-pattern"></div>
        <div class="top-accent"></div>
        <div class="decorative-circles">
            <div class="circle circle1"></div>
            <div class="circle circle2"></div>
            <div class="circle circle3"></div>
            <div class="circle circle4"></div>
        </div>
        <div class="texture-overlay"></div>
        <div class="noise"></div>
    </div>
</body>
</html>
