<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraim ポスター背景 サンプル3 - アブストラクト</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            padding: 20px;
        }
        
        .poster {
            width: 420px;
            height: 594px;
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            overflow: hidden;
            
            /* 複雑なベースグラデーション */
            background: 
                conic-gradient(from 180deg at 30% 30%, 
                    #FFF8F3 0deg, #FFE8D6 90deg, #FFCC99 180deg, #FFB380 270deg, #FFF8F3 360deg),
                linear-gradient(135deg, rgba(255, 248, 243, 0.8), rgba(255, 179, 128, 0.8));
        }
        
        /* 抽象的なブロブ形状 */
        .abstract-blob1 {
            position: absolute;
            top: -10%;
            left: -15%;
            width: 50%;
            height: 40%;
            background: 
                radial-gradient(ellipse at 30% 30%, rgba(255, 107, 53, 0.5), transparent),
                radial-gradient(ellipse at 70% 60%, rgba(255, 140, 66, 0.4), transparent);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            transform: rotate(25deg);
            filter: blur(40px);
        }
        
        .abstract-blob2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 60%;
            height: 50%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 166, 93, 0.4), transparent),
                radial-gradient(ellipse at 20% 80%, rgba(255, 204, 153, 0.3), transparent);
            border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
            transform: rotate(-35deg);
            filter: blur(50px);
        }
        
        .abstract-blob3 {
            position: absolute;
            top: 35%;
            left: 25%;
            width: 50%;
            height: 30%;
            background: radial-gradient(ellipse, rgba(255, 140, 66, 0.3), transparent);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: rotate(60deg);
            filter: blur(60px);
        }
        
        /* グラデーションメッシュ効果 */
        .gradient-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse 300px 400px at 20% 30%, rgba(255, 107, 53, 0.25) 0%, transparent 40%),
                radial-gradient(ellipse 400px 300px at 80% 20%, rgba(255, 140, 66, 0.2) 0%, transparent 40%),
                radial-gradient(ellipse 350px 350px at 60% 70%, rgba(255, 166, 93, 0.2) 0%, transparent 45%),
                radial-gradient(ellipse 250px 450px at 30% 80%, rgba(255, 204, 153, 0.15) 0%, transparent 50%);
        }
        
        /* 光の筋効果 */
        .light-rays {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background: 
                linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.4) 50%, transparent 60%),
                linear-gradient(75deg, transparent 35%, rgba(255, 255, 255, 0.3) 45%, transparent 55%),
                linear-gradient(135deg, transparent 45%, rgba(255, 255, 255, 0.2) 50%, transparent 55%);
            filter: blur(2px);
        }
        
        /* オーロラ効果 */
        .aurora {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: 
                linear-gradient(90deg, 
                    transparent, 
                    rgba(255, 107, 53, 0.1), 
                    rgba(255, 140, 66, 0.15), 
                    rgba(255, 166, 93, 0.1), 
                    transparent);
            transform: skewY(-5deg);
            filter: blur(30px);
        }
        
        /* 複雑なパターンオーバーレイ */
        .pattern-complex {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background: 
                repeating-radial-gradient(circle at 0% 0%, 
                    transparent 0, 
                    rgba(255, 140, 66, 0.3) 10px, 
                    transparent 20px, 
                    transparent 40px),
                repeating-radial-gradient(circle at 100% 100%, 
                    transparent 0, 
                    rgba(255, 166, 93, 0.3) 10px, 
                    transparent 20px, 
                    transparent 40px),
                repeating-radial-gradient(circle at 50% 50%, 
                    transparent 0, 
                    rgba(255, 107, 53, 0.2) 15px, 
                    transparent 30px, 
                    transparent 60px);
        }
        
        /* ソフトノイズテクスチャ */
        .soft-noise {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            background: 
                repeating-conic-gradient(
                    from 45deg at 20% 30%,
                    rgba(255, 140, 66, 0) 0deg,
                    rgba(255, 140, 66, 1) 3deg,
                    rgba(255, 140, 66, 0) 6deg,
                    rgba(255, 140, 66, 0) 45deg
                ),
                repeating-conic-gradient(
                    from -45deg at 80% 70%,
                    rgba(255, 166, 93, 0) 0deg,
                    rgba(255, 166, 93, 1) 3deg,
                    rgba(255, 166, 93, 0) 6deg,
                    rgba(255, 166, 93, 0) 45deg
                );
        }
        
        /* 流動的な境界線 */
        .fluid-border {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse 800px 300px at 50% 0%, transparent 50%, rgba(255, 107, 53, 0.1) 70%, transparent 100%),
                radial-gradient(ellipse 800px 300px at 50% 100%, transparent 50%, rgba(255, 166, 93, 0.1) 70%, transparent 100%),
                radial-gradient(ellipse 300px 800px at 0% 50%, transparent 50%, rgba(255, 140, 66, 0.1) 70%, transparent 100%),
                radial-gradient(ellipse 300px 800px at 100% 50%, transparent 50%, rgba(255, 204, 153, 0.1) 70%, transparent 100%);
        }
        
        /* 抽象的な線形パターン */
        .abstract-lines {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            opacity: 0.06;
            background: 
                linear-gradient(30deg, transparent 49.5%, rgba(255, 140, 66, 0.5) 49.5%, rgba(255, 140, 66, 0.5) 50.5%, transparent 50.5%),
                linear-gradient(-30deg, transparent 49.5%, rgba(255, 166, 93, 0.5) 49.5%, rgba(255, 166, 93, 0.5) 50.5%, transparent 50.5%),
                linear-gradient(60deg, transparent 49%, rgba(255, 107, 53, 0.3) 49%, rgba(255, 107, 53, 0.3) 51%, transparent 51%),
                linear-gradient(-60deg, transparent 49%, rgba(255, 204, 153, 0.3) 49%, rgba(255, 204, 153, 0.3) 51%, transparent 51%);
            background-size: 100px 100px;
        }
        
        /* 中央の輝き */
        .center-brilliance {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: 
                radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 30%),
                radial-gradient(circle, rgba(255, 140, 66, 0.1) 10%, transparent 50%);
            filter: blur(50px);
        }
        
        /* ボトムグラデーション */
        .bottom-gradient {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(180deg, transparent, rgba(255, 140, 66, 0.05), rgba(255, 107, 53, 0.1));
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="abstract-blob1"></div>
        <div class="abstract-blob2"></div>
        <div class="abstract-blob3"></div>
        <div class="gradient-mesh"></div>
        <div class="light-rays"></div>
        <div class="aurora"></div>
        <div class="pattern-complex"></div>
        <div class="soft-noise"></div>
        <div class="fluid-border"></div>
        <div class="abstract-lines"></div>
        <div class="center-brilliance"></div>
        <div class="bottom-gradient"></div>
    </div>
</body>
</html>
