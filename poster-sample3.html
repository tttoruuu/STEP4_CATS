<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraim ポスター サンプル3 - ダイナミックフロー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #d5d5d5;
            padding: 20px;
        }
        
        .poster {
            width: 420px;
            height: 594px;
            background: white;
            position: relative;
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        /* 背景の流れるようなグラデーション */
        .flow-bg {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: 
                linear-gradient(45deg, transparent 30%, #FFE8D6 50%, transparent 70%),
                linear-gradient(-45deg, transparent 30%, #FFCC99 50%, transparent 70%),
                linear-gradient(90deg, #FFF5EB, #FFE4CC);
            opacity: 0.6;
            transform: rotate(-15deg);
        }
        
        /* ヒーローエリア - 大きく目立つタイトル */
        .component-1 {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(90deg, #FF6B35 0%, #FF8C42 50%, #FFA65D 100%);
            clip-path: polygon(0 0, 100% 0, 100% 75%, 0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: 900;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            letter-spacing: 3px;
        }
        
        /* メインコンテンツ - 斜めレイアウト */
        .component-2 {
            position: absolute;
            top: 160px;
            left: 25px;
            width: 370px;
            height: 85px;
            background: white;
            border-radius: 0 25px 25px 0;
            box-shadow: 
                0 10px 30px rgba(255, 107, 53, 0.2),
                5px 5px 15px rgba(0,0,0,0.1);
            border-left: 8px solid #FF6B35;
            transform: skewX(-3deg);
        }
        
        /* フィーチャーカード1 - 浮遊感 */
        .component-3 {
            position: absolute;
            top: 265px;
            left: 40px;
            width: 150px;
            height: 100px;
            background: linear-gradient(135deg, #FF8C42, #FFA65D);
            border-radius: 20px;
            box-shadow: 
                0 15px 35px rgba(255, 140, 66, 0.3),
                0 5px 15px rgba(0,0,0,0.1);
            transform: rotate(-5deg);
        }
        
        /* フィーチャーカード2 - 重なり */
        .component-4 {
            position: absolute;
            top: 260px;
            right: 40px;
            width: 150px;
            height: 100px;
            background: linear-gradient(135deg, #FFA65D, #FFCC99);
            border-radius: 20px;
            box-shadow: 
                0 15px 35px rgba(255, 166, 93, 0.3),
                0 5px 15px rgba(0,0,0,0.1);
            transform: rotate(5deg);
        }
        
        /* 技術スペック - モダンカード */
        .component-5 {
            position: absolute;
            top: 390px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 65px;
            background: linear-gradient(90deg, #FFF5EB, white);
            border-radius: 15px;
            box-shadow: 
                0 5px 20px rgba(0,0,0,0.1),
                inset 0 1px 3px rgba(255, 140, 66, 0.1);
            border: 2px solid #FFE4CC;
        }
        
        /* CTA部分 - 目立つアクション */
        .component-6 {
            position: absolute;
            bottom: 50px;
            left: 30px;
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 25px;
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.15),
                inset 0 0 0 3px #FF8C42;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* インパクトボタン */
        .component-7 {
            position: absolute;
            bottom: 70px;
            right: 30px;
            width: 240px;
            height: 70px;
            background: linear-gradient(45deg, #FF6B35, #FF8C42, #FFA65D);
            border-radius: 35px;
            box-shadow: 
                0 15px 40px rgba(255, 107, 53, 0.4),
                0 5px 15px rgba(0,0,0,0.2),
                inset 0 -3px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }
        
        .component-7::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
        
        /* 装飾的な波 */
        .wave-decoration {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: #FF8C42;
            clip-path: polygon(
                0 20px, 
                10% 15px, 20% 20px, 30% 15px, 40% 20px,
                50% 15px, 60% 20px, 70% 15px, 80% 20px,
                90% 15px, 100% 20px, 100% 30px, 0 30px
            );
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="flow-bg"></div>
        <div class="component-1">MIRAIM</div>
        <div class="component-2"></div>
        <div class="component-3"></div>
        <div class="component-4"></div>
        <div class="component-5"></div>
        <div class="component-6">QR</div>
        <div class="component-7">今すぐ体験</div>
        <div class="wave-decoration"></div>
    </div>
</body>
</html>
