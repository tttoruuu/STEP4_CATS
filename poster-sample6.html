<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraim ポスター サンプル6 - オーガニックフロー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            padding: 20px;
        }
        
        .poster {
            width: 420px;
            height: 594px;
            background: radial-gradient(ellipse at top left, #FFF8F3, #FFE8D6),
                        radial-gradient(ellipse at bottom right, #FFCC99, #FFB380);
            position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        
        /* 有機的な背景形状 */
        .organic-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .blob {
            position: absolute;
            filter: blur(40px);
            opacity: 0.3;
        }
        
        .blob1 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #FF6B35, transparent);
            top: -50px;
            left: -50px;
            animation: float1 15s infinite ease-in-out;
        }
        
        .blob2 {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #FFA65D, transparent);
            bottom: 100px;
            right: -30px;
            animation: float2 12s infinite ease-in-out;
        }
        
        .blob3 {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FF8C42, transparent);
            top: 250px;
            left: 150px;
            animation: float3 10s infinite ease-in-out;
        }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-30px, 30px) scale(0.9); }
            66% { transform: translate(20px, -20px) scale(1.1); }
        }
        
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 40px) scale(1.2); }
        }
        
        /* コンポーネント1 - 流体形状 */
        .component-1 {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 170px;
            height: 100px;
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            box-shadow: 
                0 20px 40px rgba(255, 107, 53, 0.4),
                inset -5px -5px 15px rgba(255, 255, 255, 0.2),
                inset 5px 5px 15px rgba(0, 0, 0, 0.1);
            animation: morph1 8s ease-in-out infinite;
            backdrop-filter: blur(5px);
        }
        
        @keyframes morph1 {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }
        
        /* コンポーネント2 - レイヤードグラス */
        .component-2 {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 170px;
            height: 100px;
            position: relative;
        }
        
        .glass-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .glass1 {
            background: rgba(255, 140, 66, 0.2);
            transform: rotate(-2deg);
            box-shadow: 0 10px 30px rgba(255, 140, 66, 0.2);
        }
        
        .glass2 {
            background: rgba(255, 166, 93, 0.2);
            transform: rotate(1deg) translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 166, 93, 0.2);
        }
        
        .glass3 {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 140, 66, 0.3);
            transform: rotate(-1deg) translateY(-10px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        /* コンポーネント3 - グラデーションメッシュ */
        .component-3 {
            position: absolute;
            top: 150px;
            left: 30px;
            right: 30px;
            height: 90px;
            background: 
                radial-gradient(ellipse at 0% 0%, #FF6B35 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, #FFA65D 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, #FFCC99 0%, transparent 50%),
                radial-gradient(ellipse at 0% 100%, #FF8C42 0%, transparent 50%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.4));
            border-radius: 25px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.15),
                inset 0 1px 3px rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .mesh-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                repeating-conic-gradient(from 0deg at 50% 50%, 
                    transparent 0deg, rgba(255, 140, 66, 0.05) 10deg, transparent 20deg);
            animation: spin 20s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* コンポーネント4 - 液体エフェクト */
        .component-4 {
            position: absolute;
            top: 260px;
            left: 30px;
            width: 180px;
            height: 110px;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }
        
        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(180deg, #FFA65D, #FF8C42);
            animation: wave 3s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% {
                clip-path: polygon(
                    0% 45%, 15% 44%, 30% 50%, 45% 60%, 60% 55%, 
                    75% 45%, 90% 48%, 100% 45%, 100% 100%, 0% 100%
                );
            }
            50% {
                clip-path: polygon(
                    0% 55%, 15% 60%, 30% 55%, 45% 45%, 60% 48%, 
                    75% 55%, 90% 52%, 100% 55%, 100% 100%, 0% 100%
                );
            }
        }
        
        .liquid-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: bubble 4s infinite ease-in-out;
        }
        
        .bubble1 {
            width: 10px;
            height: 10px;
            left: 20%;
            animation-delay: 0s;
        }
        
        .bubble2 {
            width: 6px;
            height: 6px;
            left: 50%;
            animation-delay: 1s;
        }
        
        .bubble3 {
            width: 8px;
            height: 8px;
            left: 80%;
            animation-delay: 2s;
        }
        
        @keyframes bubble {
            0% { bottom: 0; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { bottom: 80%; opacity: 0; }
        }
        
        /* コンポーネント5 - ノイズテクスチャ */
        .component-5 {
            position: absolute;
            top: 260px;
            right: 30px;
            width: 180px;
            height: 110px;
            background: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E"),
                linear-gradient(135deg, #FFE8D6, #FFCC99);
            border-radius: 20px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.15),
                inset 0 0 30px rgba(255, 140, 66, 0.1);
            position: relative;
        }
        
        .component-5::before {
            content: '';
            position: absolute;
            inset: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        
        /* コンポーネント6 - 複合シェイプ */
        .component-6 {
            position: absolute;
            bottom: 110px;
            left: 30px;
            width: 150px;
            height: 90px;
            position: relative;
        }
        
        .shape-combo {
            position: absolute;
            background: linear-gradient(45deg, #FF6B35, #FFA65D);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }
        
        .shape1 {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            top: 0;
            left: 0;
            transform: rotate(45deg);
        }
        
        .shape2 {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            top: 10px;
            right: 0;
            background: linear-gradient(135deg, #FFA65D, #FFCC99);
        }
        
        .shape3 {
            width: 100px;
            height: 40px;
            border-radius: 20px;
            bottom: 0;
            left: 25px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 140, 66, 0.3);
        }
        
        /* コンポーネント7 - インタラクティブ風 */
        .component-7 {
            position: absolute;
            bottom: 100px;
            right: 30px;
            width: 210px;
            height: 100px;
            background: linear-gradient(90deg, #FF6B35 0%, #FF8C42 25%, #FFA65D 50%, #FFCC99 75%, #FFE4CC 100%);
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 20px 50px rgba(255, 140, 66, 0.4),
                inset 0 -5px 10px rgba(0, 0, 0, 0.1);
        }
        
        .slider-track {
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            transform: translateY(-50%);
        }
        
        .slider-thumb {
            position: absolute;
            top: 50%;
            left: 30%;
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                0 5px 15px rgba(0, 0, 0, 0.2),
                inset 0 0 5px rgba(255, 140, 66, 0.3);
            animation: slide 5s ease-in-out infinite;
        }
        
        @keyframes slide {
            0%, 100% { left: 30%; }
            50% { left: 70%; }
        }
        
        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 30%;
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 2s ease-out infinite, slideRing 5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        
        @keyframes slideRing {
            0%, 100% { left: 30%; }
            50% { left: 70%; }
        }
        
        /* 底部パーティクル装飾 */
        .particles {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            height: 40px;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFA65D;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatUp 3s infinite ease-out;
        }
        
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 30%; animation-delay: 0.5s; }
        .particle:nth-child(3) { left: 50%; animation-delay: 1s; }
        .particle:nth-child(4) { left: 70%; animation-delay: 1.5s; }
        .particle:nth-child(5) { left: 90%; animation-delay: 2s; }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-30px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="organic-shapes">
            <div class="blob blob1"></div>
            <div class="blob blob2"></div>
            <div class="blob blob3"></div>
        </div>
        
        <div class="component-1"></div>
        
        <div class="component-2">
            <div class="glass-layer glass1"></div>
            <div class="glass-layer glass2"></div>
            <div class="glass-layer glass3"></div>
        </div>
        
        <div class="component-3">
            <div class="mesh-overlay"></div>
        </div>
        
        <div class="component-4">
            <div class="liquid"></div>
            <div class="liquid-bubble bubble1"></div>
            <div class="liquid-bubble bubble2"></div>
            <div class="liquid-bubble bubble3"></div>
        </div>
        
        <div class="component-5"></div>
        
        <div class="component-6">
            <div class="shape-combo shape1"></div>
            <div class="shape-combo shape2"></div>
            <div class="shape-combo shape3"></div>
        </div>
        
        <div class="component-7">
            <div class="slider-track"></div>
            <div class="slider-thumb"></div>
            <div class="pulse-ring"></div>
        </div>
        
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>
</body>
</html>
